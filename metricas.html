<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Métricas · Abastecimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt-950: #17171a;
    --asphalt-900: #1e1e22;
    --asphalt-800: #28282e;
    --line: rgba(239,236,228,0.09);
    --cream: #efece4;
    --muted: rgba(239,236,228,0.5);
    --amber: #ffb020;
    --amber-dim: #cc8a1a;
    --ok: #6fd08c;
    --danger: #ff5a4e;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,176,32,0.06), transparent 55%),
      var(--asphalt-950);
    color:var(--cream);
    min-height:100vh;
    padding:32px 18px 60px;
  }
  .wrap{ max-width:760px; margin:0 auto; }

  .top{ text-align:center; margin-bottom:26px; position:relative; }
  .top .brand{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600; font-size:13px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  .top h1{
    font-family:'Barlow Condensed', sans-serif;
    font-size:30px; font-weight:700; margin:0; letter-spacing:-0.01em;
  }
  .nav-link{
    display:inline-block;
    margin-top:14px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--amber);
    text-decoration:none;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    transition:border-color 0.15s ease;
  }
  .nav-link:hover{ border-color:var(--amber-dim); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .stat{
    background:var(--asphalt-900);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 16px;
  }
  .stat .label{
    font-family:'Barlow Condensed', sans-serif;
    font-size:12px; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:8px;
  }
  .stat .value{
    font-family:'JetBrains Mono', monospace;
    font-size:24px; font-weight:700; color:var(--amber);
    line-height:1.1;
  }
  .stat .value small{ font-size:13px; color:var(--muted); font-weight:400; margin-left:2px; }
  .stat.wide{ grid-column:span 2; }

  .section{
    background:var(--asphalt-900);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 20px 8px;
    margin-bottom:18px;
  }
  .section h2{
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px; font-weight:600; letter-spacing:0.02em;
    text-transform:uppercase; margin:0 0 14px; color:var(--cream);
  }

  table{ width:100%; border-collapse:collapse; margin-bottom:12px; }
  th{
    text-align:left; font-family:'Barlow Condensed', sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted);
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  td{
    font-size:13.5px; padding:10px;
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
  }
  td.text{ font-family:'Inter', sans-serif; }
  tr:last-child td{ border-bottom:none; }

  .bar-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .bar-row:last-child{ border-bottom:none; }
  .bar-label{ width:70px; flex-shrink:0; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--muted); }
  .bar-track{ flex:1; height:10px; background:var(--asphalt-800); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--amber-dim), var(--amber)); border-radius:6px; }
  .bar-value{ width:78px; flex-shrink:0; text-align:right; font-family:'JetBrains Mono', monospace; font-size:12.5px; }

  .empty{ text-align:center; padding:26px 10px; color:var(--muted); font-size:13.5px; }
  .empty b{ color:var(--cream); }

  .loading{ text-align:center; color:var(--muted); padding:60px 0; font-family:'JetBrains Mono', monospace; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">painel de consumo</div>
    <h1>Métricas do veículo</h1>
    <a href="index.html" class="nav-link">← Registrar abastecimento</a>
  </div>

  <div id="loading" class="loading">carregando dados...</div>
  <div id="content" style="display:none;">

    <div class="grid" id="statsGrid"></div>

    <div class="section">
      <h2>Gasto por mês</h2>
      <div id="mesesContainer"></div>
    </div>

    <div class="section">
      <h2>Consumo entre tanques cheios</h2>
      <div id="tanquesContainer"></div>
    </div>

  </div>
</div>

<script>
  // 🔧 Ajuste para a URL base do seu n8n
  const BASE_URL = "https://felipefeyh.app.n8n.cloud/webhook";

  function fmtMoeda(v){
    return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtNum(v, casas = 2){
    return v === null || v === undefined ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
  }
  function fmtMes(mesStr){
    const [ano, mes] = mesStr.split('-');
    const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return nomes[parseInt(mes) - 1] + '/' + ano.slice(2);
  }
  function fmtData(dataStr){
    const d = new Date(dataStr);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }

  async function carregar(){
    try{
      const res = await fetch(BASE_URL + '/abastecimento/metricas');
      const data = await res.json();
      renderizar(data);
    }catch(err){
      document.getElementById('loading').textContent = 'Não foi possível carregar as métricas agora.';
      console.error(err);
    }
  }

  function renderizar(data){
    const r = data.resumo || {};

    // ---- cards de estatística ----
    const stats = [
      { label: 'Média km/l', value: r.mediaKmLitroPonderada, unidade: 'km/l', wide: false },
      { label: 'Custo por km', value: r.custoPorKm, unidade: 'R$/km', wide: false, moeda: true },
      { label: 'Gasto total', value: r.gastoTotal, unidade: '', wide: true, moedaGrande: true },
      { label: 'Litros abastecidos', value: r.litrosTotal, unidade: 'L', wide: false },
      { label: 'Preço médio do litro', value: r.precoMedioLitro, unidade: 'R$/L', wide: false, moeda: true },
      { label: 'Km percorridos (medidos)', value: r.kmPercorridosMedidos, unidade: 'km', wide: false, casas: 0 },
      { label: 'Abastecimentos', value: r.totalAbastecimentos, unidade: '', wide: false, casas: 0 }
    ];

    const grid = document.getElementById('statsGrid');
    grid.innerHTML = stats.map(s => `
      <div class="stat ${s.wide ? 'wide' : ''}">
        <div class="label">${s.label}</div>
        <div class="value">${
          s.value === null || s.value === undefined
            ? '—'
            : (s.moedaGrande ? fmtMoeda(s.value) : (s.moeda ? 'R$ ' + fmtNum(s.value, 3) : fmtNum(s.value, s.casas ?? 2)))
        }${s.unidade && !s.moedaGrande && !s.moeda ? '<small>' + s.unidade + '</small>' : ''}</div>
      </div>
    `).join('');

    // ---- gasto por mês ----
    const porMes = data.porMes || [];
    const mesesContainer = document.getElementById('mesesContainer');
    if (porMes.length === 0){
      mesesContainer.innerHTML = '<div class="empty">Nenhum abastecimento registrado ainda.</div>';
    } else {
      const maxGasto = Math.max(...porMes.map(m => parseFloat(m.gasto)));
      mesesContainer.innerHTML = porMes.map(m => {
        const gasto = parseFloat(m.gasto);
        const pct = maxGasto ? (gasto / maxGasto) * 100 : 0;
        return `
          <div class="bar-row">
            <div class="bar-label">${fmtMes(m.mes)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-value">${fmtMoeda(gasto)}</div>
          </div>
        `;
      }).join('');
    }

    // ---- tabela de intervalos entre tanques cheios ----
    const porTanque = data.porTanqueCheio || [];
    const tanquesContainer = document.getElementById('tanquesContainer');
    if (porTanque.length === 0){
      tanquesContainer.innerHTML = '<div class="empty">Ainda não há <b>2 abastecimentos com tanque cheio</b> pra calcular um intervalo de consumo.</div>';
    } else {
      tanquesContainer.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Posto</th>
              <th>Km rodados</th>
              <th>Litros</th>
              <th>Km/l</th>
            </tr>
          </thead>
          <tbody>
            ${porTanque.map(t => `
              <tr>
                <td class="text">${fmtData(t.data)}</td>
                <td class="text">${t.posto_nome || '—'}</td>
                <td>${fmtNum(t.km_percorridos, 0)}</td>
                <td>${fmtNum(t.litros, 1)}</td>
                <td style="color:var(--amber)">${fmtNum(t.km_por_litro, 2)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  carregar();
</script>
</body>
</html>
